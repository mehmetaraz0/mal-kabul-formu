name: GitHub Pages'e Dağıt

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Testleri çalıştır
        run: npm run test

      - name: Build al
        run: npm run build
        env:
          # Supabase "anon" anahtarı istemci tarafında herkese açık olacak şekilde
          # tasarlanmıştır (gerçek erişim kısıtı Row Level Security ile veritabanı
          # seviyesinde uygulanır) — bu yüzden GitHub Secrets yerine doğrudan burada.
          VITE_SUPABASE_URL: https://vfophsunyppexpealsct.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmb3Boc3VueXBwZXhwZWFsc2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjEzODksImV4cCI6MjEwMzMzNzM4OX0.6ud9kP8YWpisc6ruvUqC7jWIgwMPuhd55z0deCLeryI

      - name: Pages için hazırla
        uses: actions/configure-pages@v5

      - name: Build çıktısını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
